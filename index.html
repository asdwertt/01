<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理系统</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fef2f2;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
            --shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
        }

        .header {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 0 32px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: -.02em; }
        .header h1 .icon { font-size: 1.6rem; }
        .header-actions { display: flex; gap: 10px; }

        .container { display: flex; height: calc(100vh - 64px); }

        .sidebar {
            width: 272px; background: var(--card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-header { padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 700; }
        .category-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
        .category-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 14px; border-radius: var(--radius-sm); cursor: pointer;
            margin-bottom: 2px; transition: all .18s; font-size: .9rem; font-weight: 500;
        }
        .category-item:hover { background: #f1f5f9; }
        .category-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
        .category-item .count { font-size: .72rem; color: var(--text-muted); background: var(--bg); padding: 2px 9px; border-radius: 14px; font-weight: 600; min-width: 26px; text-align: center; }
        .category-item.active .count { background: #c7d2fe; color: var(--primary); }
        .category-item .extra-badge { font-size: .65rem; color: #059669; background: #d1fae5; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
        .category-del { opacity: 0; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; transition: opacity .18s; line-height: 1; }
        .category-item:hover .category-del { opacity: 1; }
        .category-del:hover { background: var(--danger-light); }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f8fafc; }
        .main-header { padding: 22px 32px 16px; display: flex; align-items: center; justify-content: space-between; }
        .main-header h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
        .main-header .breadcrumb { color: var(--text-muted); font-size: .83rem; }

        .search-bar { padding: 0 32px 18px; display: flex; align-items: center; }
        .search-bar .search-wrap {
            display: flex; align-items: center; background: var(--card);
            border: 2px solid var(--border); border-radius: 10px; padding: 0 16px;
            width: 100%; max-width: 520px; transition: border-color .2s, box-shadow .2s;
        }
        .search-bar .search-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
        .search-bar .search-icon { font-size: 1.1rem; color: var(--text-muted); flex-shrink: 0; }
        .search-bar input { flex: 1; border: none; padding: 13px 12px; font-size: .94rem; outline: none; background: transparent; color: var(--text); }
        .search-bar input::placeholder { color: #c0c8d4; }
        .search-bar .clear-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; padding: 8px; border-radius: 50%; display: none; line-height: 1; transition: all .15s; flex-shrink: 0; }
        .search-bar .clear-btn:hover { background: #f1f5f9; color: var(--text); }

        .table-wrap { flex: 1; overflow-y: auto; padding: 0 32px 24px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 14px 18px; text-align: left; font-size: .88rem; }
        th { background: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 2px solid var(--border); white-space: nowrap; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--primary); background: #eef2ff; }
        th .filter-icon { font-size: .75rem; margin-left: 6px; cursor: pointer; opacity: .35; vertical-align: middle; transition: opacity .15s; }
        th .filter-icon:hover { opacity: .8; }
        th .filter-icon.active { opacity: 1; color: var(--primary); }
        .filter-dropdown {
            position: absolute; background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: 0 8px 30px rgba(0,0,0,.12);
            z-index: 300; min-width: 180px; max-height: 260px; overflow-y: auto; padding: 6px 0;
            animation: fadeIn .12s;
        }
        .filter-dropdown label {
            display: flex; align-items: center; gap: 8px; padding: 6px 14px;
            font-size: .82rem; cursor: pointer; white-space: nowrap; margin: 0;
        }
        .filter-dropdown label:hover { background: #f1f5f9; }
        .filter-dropdown input[type="checkbox"] { width: auto; accent-color: var(--primary); }
        .filter-dropdown .filter-actions {
            display: flex; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--border);
        }
        td { border-bottom: 1px solid #f1f5f9; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background .12s; }
        tbody tr:hover td { background: #f8fafc; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 3.5rem; display: block; margin-bottom: 14px; }
        .empty-state p { font-size: .95rem; }
        td code { background: #f1f5f9; padding: 3px 8px; border-radius: 5px; font-size: .82rem; font-weight: 600; color: var(--primary); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
            border-radius: var(--radius-sm); font-size: .85rem; font-weight: 600;
            border: none; cursor: pointer; transition: all .18s; white-space: nowrap; letter-spacing: .01em;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(99,102,241,.3); }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(99,102,241,.35); transform: translateY(-1px); }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid #c7d2fe; box-shadow: var(--shadow-sm); }
        .btn-outline:hover { background: var(--primary-light); border-color: var(--primary); }
        .btn-sm { padding: 6px 12px; font-size: .78rem; border-radius: 6px; }
        .btn-danger-sm { padding: 6px 12px; font-size: .78rem; border-radius: 6px; font-weight: 500; background: none; border: 1.5px solid #fecaca; color: var(--danger); cursor: pointer; transition: all .15s; }
        .btn-danger-sm:hover { background: var(--danger-light); border-color: var(--danger); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,.4); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center; z-index: 200; animation: fadeIn .18s;
        }
        .modal {
            background: var(--card); border-radius: 16px; padding: 28px 32px;
            width: 500px; max-width: 92vw; box-shadow: 0 25px 80px rgba(0,0,0,.18);
            max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { margin-bottom: 20px; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
        .modal label { display: block; font-size: .82rem; font-weight: 600; color: var(--text); margin-bottom: 5px; margin-top: 16px; }
        .modal label:first-of-type { margin-top: 0; }
        .modal input, .modal select { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: .9rem; outline: none; transition: all .18s; background: #fafbfc; }
        .modal input:focus, .modal select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,.1); background: #fff; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
        .select-row { display: flex; gap: 8px; }
        .select-row select { flex: 1; }
        .select-row button { flex-shrink: 0; padding: 11px 14px; }
        .hint { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .toast {
            position: fixed; bottom: 36px; right: 36px; background: #1e293b; color: #fff;
            padding: 14px 22px; border-radius: 10px; font-size: .88rem;
            z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,.15); animation: slideUp .3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1><span class="icon">📦</span>商品管理系统</h1>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="exportData()">📥 导出数据</button>
            <button class="btn btn-outline btn-sm" onclick="importData()">📤 导入数据</button>
            <button class="btn btn-primary btn-sm" onclick="exportExcel()">📊 导出Excel</button>
        </div>
    </div>

    <!-- Body -->
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 型号分类</h2>
                <button class="btn btn-primary btn-sm" onclick="openCategoryModal()">＋ 添加</button>
            </div>
            <div class="category-list" id="categoryList"></div>
        </aside>

        <section class="main">
            <div class="main-header" id="mainHeader">
                <div>
                    <h2 id="mainTitle">全部商品</h2>
                    <span class="breadcrumb" id="breadcrumb"></span>
                </div>
                <button class="btn btn-primary" onclick="openProductModal()">＋ 添加商品</button>
            </div>
            <div class="search-bar">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input id="searchInput" placeholder="搜索 ID / 品牌 / 规格…" oninput="onSearch()">
                    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
                </div>
            </div>
            <div class="table-wrap" id="tableWrap"></div>
        </section>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="categoryModal" style="display:none">
        <div class="modal">
            <h3 id="categoryModalTitle">添加型号分类</h3>
            <label>型号分类名称</label>
            <input id="categoryNameInput" placeholder="例如：贴片电阻、插件电阻…" maxlength="30">
            <label>商品名称列名（可选）</label>
            <input id="categoryNameLabelInput" placeholder="留空则默认「商品名称」" maxlength="20">
            <p class="hint">不同分类可设不同名称，如：阻值、电压、容量…</p>
            <label>自定义额外列名（可选）</label>
            <input id="categoryExtraFieldInput" placeholder="例如：精度、功率、颜色…留空则不显示" maxlength="20">
            <p class="hint">设置后，该分类下的商品表格和弹窗会多出此列</p>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" onclick="closeCategoryModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal" style="display:none">
        <div class="modal">
            <h3 id="productModalTitle">添加商品</h3>

            <label>商品ID</label>
            <input id="productIdInput" placeholder="自定义ID，如：SKU-001、A100…" maxlength="30" required>

            <label>品牌（可选）</label>
            <div class="select-row">
                <select id="productBrandSelect">
                    <option value="">-- 请选择品牌 --</option>
                </select>
                <button class="btn btn-outline btn-sm" onclick="quickAddBrand()" title="快速添加品牌">＋</button>
            </div>

            <label>规格</label>
            <input id="productModelInput" list="modelList" placeholder="输入规格，已有值会自动提示…" maxlength="50" autocomplete="off">
            <datalist id="modelList"></datalist>

            <label id="productNameLabel">商品名称（可选）</label>
            <input id="productNameInput" list="nameList" placeholder="输入名称，已有值会自动提示…" maxlength="80" autocomplete="off">
            <datalist id="nameList"></datalist>

            <!-- 动态额外字段 -->
            <label id="extraFieldLabel" style="display:none"></label>
            <input id="productExtraInput" placeholder="" maxlength="50" style="display:none">

            <label>价格（元）</label>
            <input id="productPriceInput" type="number" placeholder="0.00" step="0.01" min="0">

            <label>所属分类</label>
            <select id="productCategorySelect" onchange="onProductCategoryChange()"></select>

            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" onclick="closeProductModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal-overlay" id="imageModal" style="display:none">
        <div class="modal" style="width:700px;max-width:95vw;">
            <h3 id="imageModalTitle">📷 商品图片</h3>
            <div id="imageProductInfo" style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px;"></div>

            <div id="imageGallery" style="margin-bottom:16px;min-height:80px;">
                <div id="imageCards" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;"></div>
                <div id="noImageHint" style="color:var(--text-muted);text-align:center;width:100%;padding:40px;">
                    <span style="font-size:3rem;display:block;margin-bottom:8px;">🖼️</span>暂无图片，点击下方按钮上传
                </div>
            </div>

            <div style="display:flex;gap:10px;">
                <label class="btn btn-primary btn-sm" style="cursor:pointer;">
                    📤 上传图片
                    <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload()">
                </label>
                <span style="font-size:.75rem;color:var(--text-muted);align-self:center;">支持所有图片格式，无大小限制</span>
            </div>

            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" onclick="closeImageModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="imageLightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;cursor:pointer;"
         onclick="this.style.display='none'">
        <img id="lightboxImg" src="" style="max-width:95vw;max-height:95vh;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);object-fit:contain;"
             onclick="event.stopPropagation()">
        <span style="position:absolute;top:20px;right:30px;color:#fff;font-size:2rem;cursor:pointer;">✕</span>
    </div>

    <script>
        const STORAGE_KEY = 'product_mgr_data_v2';

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return { categories: [], brands: [], products: [] };
        }

        function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        // ──────────────── IndexedDB 图片存储 ────────────────
        const IMG_DB_NAME = 'ProductImages';
        const IMG_STORE = 'images';

        function openImageDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IMG_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IMG_STORE)) {
                        const store = db.createObjectStore(IMG_STORE, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('productId', 'productId', { unique: false });
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function getImages(productId) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMG_STORE, 'readonly');
                const store = tx.objectStore(IMG_STORE);
                const idx = store.index('productId');
                const req = idx.getAll(productId);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function addImage(productId, file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async () => {
                    const db = await openImageDB();
                    const tx = db.transaction(IMG_STORE, 'readwrite');
                    const store = tx.objectStore(IMG_STORE);
                    const record = {
                        productId,
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: reader.result,
                        addedAt: Date.now()
                    };
                    const req = store.add(record);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        async function deleteImage(imageId) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMG_STORE, 'readwrite');
                const store = tx.objectStore(IMG_STORE);
                const req = store.delete(imageId);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function getImageCount(productId) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMG_STORE, 'readonly');
                const store = tx.objectStore(IMG_STORE);
                const idx = store.index('productId');
                const req = idx.count(productId);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        let app = loadData();
        function persist() { saveData(app); }
        // 数据兼容性迁移
        function migrateData(data) {
            if (!data.brands) data.brands = [];
            data.products.forEach(p => { if (typeof p.id === 'number') p.id = String(p.id); });
            data.categories.forEach(c => { if (typeof c.id === 'number') c.id = String(c.id); });
            data.products.forEach(p => {
                if (p.accuracy != null && p.extraValue == null) { p.extraValue = p.accuracy; delete p.accuracy; }
            });
        }
        migrateData(app);

        let selectedCategoryId = null;
        let searchKeyword = '';
        let sortColumn = null;      // 'id' | 'brand' | 'model' | 'name' | 'extra' | 'category' | 'price'
        let sortDir = 'asc';        // 'asc' | 'desc'

        function setSort(col) {
            if (sortColumn === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = col;
                sortDir = 'asc';
            }
            renderTable();
        }

        function sortProducts(list) {
            if (!sortColumn) return list;
            const dir = sortDir === 'asc' ? 1 : -1;
            const catMap = {};
            app.categories.forEach(c => { catMap[c.id] = c.name; });
            return [...list].sort((a, b) => {
                let va, vb;
                switch (sortColumn) {
                    case 'id':       va = (a.id || '').toLowerCase(); vb = (b.id || '').toLowerCase(); break;
                    case 'brand':    va = (a.brand || '').toLowerCase(); vb = (b.brand || '').toLowerCase(); break;
                    case 'model':    va = (a.model || '').toLowerCase(); vb = (b.model || '').toLowerCase(); break;
                    case 'name':     va = (a.name || '').toLowerCase(); vb = (b.name || '').toLowerCase(); break;
                    case 'extra':    va = (a.extraValue || '').toLowerCase(); vb = (b.extraValue || '').toLowerCase(); break;
                    case 'category': va = (catMap[a.categoryId] || '').toLowerCase(); vb = (catMap[b.categoryId] || '').toLowerCase(); break;
                    case 'price':    va = a.price != null ? a.price : -Infinity; vb = b.price != null ? b.price : -Infinity; break;
                    default: return 0;
                }
                if (va < vb) return -1 * dir;
                if (va > vb) return 1 * dir;
                return 0;
            });
        }

        // ──────────────── Filter ────────────────
        let filters = { brand: new Set(), model: new Set(), name: new Set() };
        let activeFilterCol = null;

        function toggleFilter(col, event) {
            event.stopPropagation();
            closeFilterDropdown();
            if (activeFilterCol === col) { activeFilterCol = null; return; }
            activeFilterCol = col;
            const th = event.target.closest('th');
            const rect = th.getBoundingClientRect();
            const dd = document.createElement('div');
            dd.className = 'filter-dropdown';
            dd.id = 'filterDropdown';
            dd.style.top = (rect.bottom + 4) + 'px';
            dd.style.left = rect.left + 'px';

            // 获取该列所有不重复值
            const allVals = new Set();
            const colKey = col; // 'brand', 'model', 'name'
            app.products.forEach(p => {
                let val = '';
                if (colKey === 'brand') val = p.brand || '';
                else if (colKey === 'model') val = p.model || '';
                else if (colKey === 'name') val = p.name || '';
                if (val) allVals.add(val);
            });
            const sorted = [...allVals].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

            dd.innerHTML = sorted.map(v => {
                const checked = filters[colKey].has(v) ? ' checked' : '';
                return `<label><input type="checkbox" value="${escAttr(v)}"${checked}
                    onchange="updateFilter('${colKey}', '${escAttr(v)}', this.checked)">${escHtml(v)}</label>`;
            }).join('') + `<div class="filter-actions">
                <button class="btn btn-outline btn-sm" style="flex:1;" onclick="clearFilter('${colKey}')">清除</button>
                <button class="btn btn-primary btn-sm" style="flex:1;" onclick="selectAllFilter('${colKey}')">全选</button>
            </div>`;

            dd.onclick = (e) => e.stopPropagation(); // 面板内点击不冒泡
            document.body.appendChild(dd);
            // 点击面板外部关闭
            setTimeout(() => document.addEventListener('click', closeFilterDropdown, { once: true }), 0);
        }

        function updateFilter(col, val, checked) {
            if (checked) { filters[col].add(val); } else { filters[col].delete(val); }
            renderTable();
        }

        function clearFilter(col) {
            filters[col] = new Set();
            closeFilterDropdown();
            renderTable();
        }

        function selectAllFilter(col) {
            filters[col] = new Set();
            const dd = document.getElementById('filterDropdown');
            if (dd) dd.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = true; });
            // 全选即清除该列筛选（所有值都允许等同于不过滤）
            closeFilterDropdown();
            renderTable();
        }

        function closeFilterDropdown() {
            const dd = document.getElementById('filterDropdown');
            if (dd) dd.remove();
            activeFilterCol = null;
        }

        function applyFilters(list) {
            if (filters.brand.size > 0) list = list.filter(p => filters.brand.has(p.brand || ''));
            if (filters.model.size > 0) list = list.filter(p => filters.model.has(p.model || ''));
            if (filters.name.size > 0) list = list.filter(p => filters.name.has(p.name || ''));
            return list;
        }

        // 获取当前选中分类的 extraField
        function getCurrentExtraField() {
            if (!selectedCategoryId) return null;
            const cat = app.categories.find(c => c.id === selectedCategoryId);
            return cat && cat.extraField ? cat.extraField : null;
        }
        function getCurrentNameLabel() {
            if (!selectedCategoryId) return '商品名称';
            const cat = app.categories.find(c => c.id === selectedCategoryId);
            return cat && cat.nameLabel ? cat.nameLabel : '商品名称';
        }

        // ──────────────── Search ────────────────
        function onSearch() {
            const kw = document.getElementById('searchInput').value.trim().toLowerCase();
            searchKeyword = kw;
            document.getElementById('clearBtn').style.display = kw ? '' : 'none';
            renderTable();
            updateMainHeader();
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchKeyword = '';
            document.getElementById('clearBtn').style.display = 'none';
            renderTable();
            updateMainHeader();
        }

        // ──────────────── Rendering ────────────────
        function renderAll() { renderSidebar(); renderTable(); updateMainHeader(); }

        function renderSidebar() {
            const list = document.getElementById('categoryList');
            const cats = app.categories;
            if (cats.length === 0) {
                list.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center;font-size:.85rem;">暂无分类<br>点击「＋添加」创建</div>';
                return;
            }
            list.innerHTML = cats.map(c => {
                const count = app.products.filter(p => p.categoryId === c.id).length;
                const active = selectedCategoryId === c.id ? ' active' : '';
                const badge = c.extraField ? `<span class="extra-badge">${escHtml(c.extraField)}</span>` : '';
                return `
                <div class="category-item${active}" onclick="selectCategory('${escAttr(c.id)}')">
                    <span>${escHtml(c.name)}${badge} <span class="count">${count}</span></span>
                    <button class="category-del" onclick="event.stopPropagation();deleteCategory('${escAttr(c.id)}')" title="删除">×</button>
                </div>`;
            }).join('');

            const allActive = selectedCategoryId === null ? ' active' : '';
            const total = app.products.length;
            list.insertAdjacentHTML('afterbegin', `
                <div class="category-item${allActive}" onclick="selectCategory(null)" style="margin-bottom:6px;font-weight:500;">
                    <span>📦 全部商品 <span class="count">${total}</span></span>
                </div>
            `);
        }

        function renderTable() {
            const wrap = document.getElementById('tableWrap');
            let products = app.products;
            if (selectedCategoryId !== null) {
                products = products.filter(p => p.categoryId === selectedCategoryId);
            }
            if (searchKeyword) {
                products = products.filter(p => {
                    const extraVal = p.extraValue != null ? String(p.extraValue).toLowerCase() : '';
                    return (p.id || '').toLowerCase().includes(searchKeyword) ||
                           (p.brand || '').toLowerCase().includes(searchKeyword) ||
                           (p.model || '').toLowerCase().includes(searchKeyword) ||
                           (p.name || '').toLowerCase().includes(searchKeyword) ||
                           extraVal.includes(searchKeyword);
                });
            }

            // 应用列筛选
            products = applyFilters(products);

            const extraField = getCurrentExtraField();
            const nameLabel = getCurrentNameLabel();
            const hasExtra = !!extraField;

            if (products.length === 0) {
                wrap.innerHTML = `<div class="empty-state"><span class="icon">📭</span><p>暂无商品，点击「添加商品」开始管理</p></div>`;
                return;
            }

            // 排序
            products = sortProducts(products);

            const catMap = {};
            app.categories.forEach(c => { catMap[c.id] = c.name; });

            function th(col, label, filterable) {
                let sortArrow = '';
                if (sortColumn === col) {
                    sortArrow = sortDir === 'asc' ? ' ▲' : ' ▼';
                }
                let filterIcon = '';
                if (filterable) {
                    const hasFilter = filters[col] && filters[col].size > 0;
                    filterIcon = `<span class="filter-icon${hasFilter ? ' active' : ''}" onclick="toggleFilter('${col}',event)" title="筛选" style="margin-left:6px;font-size:.75rem;">🔽</span>`;
                }
                return `<th class="sortable" onclick="setSort('${col}')">${label}${sortArrow}${filterIcon}</th>`;
            }

            const extraTh = hasExtra ? th('extra', escHtml(extraField), false) : '';
            const rows = products.map(p => {
                const extraTd = hasExtra ? `<td>${escHtml(p.extraValue != null ? p.extraValue : '-')}</td>` : '';
                return `<tr onclick="openImageModal('${escAttr(p.id)}')" style="cursor:pointer;" title="点击查看/上传图片">
                    <td><code>${escHtml(p.id)}</code> <span class="img-badge" data-pid="${escAttr(p.id)}" style="font-size:.7rem;"></span></td>
                    <td><strong>${escHtml(p.brand || '-')}</strong></td>
                    <td>${escHtml(p.model)}</td>
                    <td>${escHtml(p.name || '-')}</td>
                    ${extraTd}
                    <td>${catMap[p.categoryId] || '未分类'}</td>
                    <td>${p.price != null ? '¥' + Number(p.price).toFixed(2) : '-'}</td>
                    <td>
                        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openProductModal('${escAttr(p.id)}')" style="margin-right:4px">✎</button>
                        <button class="btn-danger-sm" onclick="event.stopPropagation();deleteProduct('${escAttr(p.id)}')">🗑</button>
                    </td>
                </tr>`;
            }).join('');

            wrap.innerHTML = `<table>
                <thead><tr>
                    ${th('id','ID')}${th('brand','品牌',true)}${th('model','规格',true)}${th('name',escHtml(nameLabel),true)}
                    ${extraTh}
                    ${th('category','分类')}${th('price','价格')}<th>操作</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
            // 异步加载图片计数
            products.forEach(p => {
                getImageCount(p.id).then(count => {
                    const badge = document.querySelector(`.img-badge[data-pid="${p.id}"]`);
                    if (badge && count > 0) badge.textContent = '🖼️' + count;
                }).catch(() => {});
            });
        }

        function updateMainHeader() {
            if (selectedCategoryId === null) {
                document.getElementById('mainTitle').textContent = '全部商品';
                document.getElementById('breadcrumb').textContent = `共 ${app.products.length} 件商品`;
            } else {
                const cat = app.categories.find(c => c.id === selectedCategoryId);
                const name = cat ? cat.name : '未知';
                const count = app.products.filter(p => p.categoryId === selectedCategoryId).length;
                document.getElementById('mainTitle').textContent = name;
                const extra = cat && cat.extraField ? ` | 额外列：${cat.extraField}` : '';
                document.getElementById('breadcrumb').textContent = `共 ${count} 件商品${extra}`;
            }
        }

        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // ──────────────── Actions: Category ────────────────
        function selectCategory(id) {
            selectedCategoryId = id;
            document.getElementById('searchInput').value = '';
            searchKeyword = '';
            document.getElementById('clearBtn').style.display = 'none';
            renderAll();
        }

        let editingCategoryId = null;

        function openCategoryModal(id) {
            editingCategoryId = id || null;
            document.getElementById('categoryModalTitle').textContent = id ? '编辑型号分类' : '添加型号分类';
            const nameInput = document.getElementById('categoryNameInput');
            const nameLabelInput = document.getElementById('categoryNameLabelInput');
            const extraInput = document.getElementById('categoryExtraFieldInput');
            if (id) {
                const cat = app.categories.find(c => c.id === id);
                nameInput.value = cat ? cat.name : '';
                nameLabelInput.value = cat && cat.nameLabel ? cat.nameLabel : '';
                extraInput.value = cat && cat.extraField ? cat.extraField : '';
            } else {
                nameInput.value = '';
                nameLabelInput.value = '';
                extraInput.value = '';
            }
            document.getElementById('categoryModal').style.display = '';
            nameInput.focus();
        }

        function closeCategoryModal() { document.getElementById('categoryModal').style.display = 'none'; editingCategoryId = null; }

        function saveCategory() {
            const name = document.getElementById('categoryNameInput').value.trim();
            if (!name) return toast('请输入型号分类名称');
            const nameLabel = document.getElementById('categoryNameLabelInput').value.trim() || null;
            const extraField = document.getElementById('categoryExtraFieldInput').value.trim() || null;

            if (editingCategoryId) {
                const cat = app.categories.find(c => c.id === editingCategoryId);
                if (cat) { cat.name = name; cat.nameLabel = nameLabel; cat.extraField = extraField; }
                toast('分类已更新');
            } else {
                const newId = 'C' + Date.now();
                app.categories.push({ id: newId, name, nameLabel, extraField });
                toast('分类已添加');
            }
            persist();
            closeCategoryModal();
            renderAll();
        }

        function deleteCategory(id) {
            const cat = app.categories.find(c => c.id === id);
            if (!cat) return;
            const linked = app.products.filter(p => p.categoryId === id).length;
            const msg = linked
                ? `分类「${cat.name}」下有 ${linked} 件商品，删除分类后这些商品将变为"未分类"。确定删除？`
                : `确定删除分类「${cat.name}」？`;
            if (!confirm(msg)) return;
            app.categories = app.categories.filter(c => c.id !== id);
            app.products.forEach(p => { if (p.categoryId === id) p.categoryId = null; });
            if (selectedCategoryId === id) selectedCategoryId = null;
            persist();
            renderAll();
            toast('分类已删除');
        }

        // ──────────────── Actions: Brand ────────────────
        function fillBrandSelect() {
            const sel = document.getElementById('productBrandSelect');
            const currentVal = sel.value;
            sel.innerHTML = '<option value="">-- 请选择品牌 --</option>' +
                app.brands.map(b => `<option value="${escAttr(b.id)}">${escHtml(b.name)}</option>`).join('');
            sel.value = currentVal;
        }

        function quickAddBrand() {
            const name = prompt('输入新品牌名称：');
            if (!name || !name.trim()) return;
            const trimmed = name.trim();
            if (app.brands.some(b => b.name.toLowerCase() === trimmed.toLowerCase())) {
                toast('品牌已存在');
                const b = app.brands.find(b => b.name.toLowerCase() === trimmed.toLowerCase());
                document.getElementById('productBrandSelect').value = b.id;
                return;
            }
            const newBrand = { id: 'B' + Date.now(), name: trimmed };
            app.brands.push(newBrand);
            persist();
            fillBrandSelect();
            document.getElementById('productBrandSelect').value = newBrand.id;
            toast('品牌已添加并选中');
        }

        function fillModelSelect(catId) {
            const dl = document.getElementById('modelList');
            const values = new Set();
            if (catId) {
                app.products.filter(p => p.categoryId === catId).forEach(p => {
                    if (p.model) values.add(p.model);
                });
            }
            dl.innerHTML = [...values].map(v => `<option value="${escAttr(v)}">`).join('');
        }

        function fillNameSelect(catId) {
            const dl = document.getElementById('nameList');
            const values = new Set();
            if (catId) {
                app.products.filter(p => p.categoryId === catId).forEach(p => {
                    if (p.name) values.add(p.name);
                });
            }
            dl.innerHTML = [...values].map(v => `<option value="${escAttr(v)}">`).join('');
        }

        // ──────────────── Actions: Product ────────────────
        let editingProductId = null;

        function onProductCategoryChange() {
            const catId = document.getElementById('productCategorySelect').value;
            const cat = catId ? app.categories.find(c => c.id === catId) : null;

            // 更新商品名称列标签
            const nameLabel = document.getElementById('productNameLabel');
            const nameLabelText = (cat && cat.nameLabel) ? cat.nameLabel : '商品名称';
            nameLabel.textContent = nameLabelText + '（可选）';

            // 更新额外字段
            const extraLabel = document.getElementById('extraFieldLabel');
            const extraInput = document.getElementById('productExtraInput');
            if (cat && cat.extraField) {
                extraLabel.style.display = '';
                extraInput.style.display = '';
                extraLabel.textContent = cat.extraField;
                extraInput.placeholder = '请输入' + cat.extraField;
            } else {
                extraLabel.style.display = 'none';
                extraInput.style.display = 'none';
                extraInput.value = '';
            }

            fillModelSelect(catId);
            fillNameSelect(catId);
        }

        function openProductModal(id) {
            editingProductId = id || null;
            document.getElementById('productModalTitle').textContent = id ? '编辑商品' : '添加商品';

            const idInput = document.getElementById('productIdInput');
            idInput.value = '';
            idInput.readOnly = false;

            document.getElementById('productBrandSelect').value = '';            document.getElementById('productModelInput').value = '';
            document.getElementById('productNameInput').value = '';
            document.getElementById('productPriceInput').value = '';
            document.getElementById('productExtraInput').value = '';

            const sel = document.getElementById('productCategorySelect');
            sel.innerHTML = '<option value="">-- 请选择分类 --</option>' +
                app.categories.map(c => `<option value="${escAttr(c.id)}">${escHtml(c.name)}</option>`).join('');

            fillBrandSelect();

            if (id) {
                const p = app.products.find(p => p.id === id);
                if (p) {
                    idInput.value = p.id;
                    document.getElementById('productBrandSelect').value = p.brandId || '';
                    document.getElementById('productModelInput').value = p.model;
                    document.getElementById('productNameInput').value = p.name || '';
                    document.getElementById('productPriceInput').value = p.price != null ? p.price : '';
                    document.getElementById('productExtraInput').value = p.extraValue != null ? p.extraValue : '';
                    sel.value = p.categoryId || '';
                }
            } else if (selectedCategoryId) {
                sel.value = selectedCategoryId;
            }

            onProductCategoryChange();

            document.getElementById('productModal').style.display = '';
            if (id) {
                document.getElementById('productBrandSelect').focus();
            } else {
                idInput.focus();
            }
        }

        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; editingProductId = null; }

        function saveProduct() {
            const customId = document.getElementById('productIdInput').value.trim();
            if (!customId) return toast('请输入商品ID');
            if (!editingProductId && app.products.some(p => p.id === customId)) return toast('该ID已存在');
            if (editingProductId && customId !== editingProductId && app.products.some(p => p.id === customId)) return toast('该ID已被其他商品占用');

            const brandId = document.getElementById('productBrandSelect').value || null;
            const brandObj = app.brands.find(b => b.id === brandId);
            const brandName = brandObj ? brandObj.name : '';

            const model = document.getElementById('productModelInput').value.trim();
            if (!model) return toast('请输入规格');

            const name = document.getElementById('productNameInput').value.trim();
            const priceRaw = document.getElementById('productPriceInput').value;
            const price = priceRaw !== '' ? parseFloat(priceRaw) : null;
            const extraValue = document.getElementById('productExtraInput').value.trim() || null;
            const categoryIdRaw = document.getElementById('productCategorySelect').value;
            const categoryId = categoryIdRaw || null;

            if (editingProductId) {
                const p = app.products.find(p => p.id === editingProductId);
                if (p) {
                    p.id = customId;
                    p.brandId = brandId; p.brand = brandName;
                    p.model = model; p.name = name || null;
                    p.price = price; p.extraValue = extraValue;
                    p.categoryId = categoryId;
                }
                toast('商品已更新');
            } else {
                app.products.push({
                    id: customId, brandId, brand: brandName,
                    model, name: name || null,
                    extraValue, price, categoryId
                });
                toast('商品已添加');
            }
            persist();
            closeProductModal();
            renderAll();
        }

        function deleteProduct(id) {
            const p = app.products.find(p => p.id === id);
            if (!p) return;
            if (!confirm(`确定删除商品「${p.brand || '无品牌'} ${p.model}」（ID: ${p.id}）？`)) return;
            app.products = app.products.filter(p => p.id !== id);
            persist();
            renderAll();
            toast('商品已删除');
        }

        // ──────────────── Export Excel ────────────────
        function exportExcel() {
            if (!window.XLSX) return toast('Excel 库加载失败，请检查网络');
            const wb = XLSX.utils.book_new();

            // 全部商品
            const extraHead = getCurrentExtraField() || '额外属性';
            const nameHead = getCurrentNameLabel();
            const allData = [['ID','品牌','规格',nameHead,extraHead,'分类','价格']];
            app.products.forEach(p => {
                const cat = app.categories.find(c => c.id === p.categoryId);
                allData.push([p.id, p.brand || '', p.model, p.name || '', p.extraValue || '', cat ? cat.name : '未分类', p.price != null ? p.price : '']);
            });
            const allWs = XLSX.utils.aoa_to_sheet(allData);
            allWs['!cols'] = [{wch:12},{wch:14},{wch:18},{wch:18},{wch:12},{wch:12},{wch:10}];
            XLSX.utils.book_append_sheet(wb, allWs, '全部商品');

            // 每个分类
            app.categories.forEach(cat => {
                const items = app.products.filter(p => p.categoryId === cat.id);
                const eHead = cat.extraField || '额外属性';
                const nHead = cat.nameLabel || '商品名称';
                const rows = [['ID','品牌','规格',nHead,eHead,'价格']];
                items.forEach(p => {
                    rows.push([p.id, p.brand || '', p.model, p.name || '', p.extraValue || '', p.price != null ? p.price : '']);
                });
                const ws = XLSX.utils.aoa_to_sheet(rows);
                ws['!cols'] = [{wch:12},{wch:14},{wch:18},{wch:18},{wch:12},{wch:10}];
                const sheetName = cat.name.length > 28 ? cat.name.slice(0,28)+'…' : cat.name;
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            XLSX.writeFile(wb, '商品数据_' + new Date().toISOString().slice(0,10) + '.xlsx');
            toast('Excel 已导出');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(app, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '商品数据备份_' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            toast('数据已导出');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = () => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!data.categories || !data.products) throw new Error('格式错误');
                        if (!confirm(`即将导入 ${data.categories.length} 个分类、${data.brands? data.brands.length : 0} 个品牌、${data.products.length} 件商品，当前数据将被覆盖。确定？`)) return;
                        app = data;
                        migrateData(app);
                        selectedCategoryId = null;
                        persist();
                        renderAll();
                        toast('数据已导入');
                    } catch(e) { toast('导入失败：文件格式不正确'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ──────────────── Image Management ────────────────
        let currentImageProductId = null;

        async function openImageModal(productId) {
            currentImageProductId = productId;
            const p = app.products.find(p => p.id === productId);
            if (p) {
                document.getElementById('imageModalTitle').textContent = '📷 ' + (p.brand || '') + ' ' + p.model;
                document.getElementById('imageProductInfo').textContent = 'ID: ' + p.id + ' | 品牌: ' + (p.brand || '-') + ' | 规格: ' + p.model;
            }
            document.getElementById('imageFileInput').value = '';
            await renderImageGallery();
            document.getElementById('imageModal').style.display = '';
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            currentImageProductId = null;
        }

        async function renderImageGallery() {
            const cards = document.getElementById('imageCards');
            const hint = document.getElementById('noImageHint');
            if (!currentImageProductId) return;
            const images = await getImages(currentImageProductId);
            if (images.length === 0) {
                cards.innerHTML = '';
                hint.style.display = '';
                return;
            }
            hint.style.display = 'none';
            cards.innerHTML = images.map(img => `
                <div class="img-card" style="position:relative;width:160px;height:160px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#f8fafc;flex-shrink:0;">
                    <img src="${img.data}" alt="${escHtml(img.name)}"
                        style="width:100%;height:100%;object-fit:cover;cursor:pointer;"
                        onclick="event.stopPropagation();document.getElementById('lightboxImg').src='${img.data.replace(/'/g,"\\'")}';document.getElementById('imageLightbox').style.display='';"
                        title="点击放大">
                    <button onclick="event.stopPropagation();deleteImageAndRefresh(${img.id})"
                        style="position:absolute;top:4px;right:4px;background:rgba(239,68,68,.85);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1;"
                        title="删除">×</button>
                    <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:.65rem;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(img.name)}</div>
                </div>
            `).join('');
        }

        async function handleImageUpload() {
            const input = document.getElementById('imageFileInput');
            const files = input.files;
            if (!files.length || !currentImageProductId) return;
            for (const file of files) {
                await addImage(currentImageProductId, file);
            }
            await renderImageGallery();
            toast(`已上传 ${files.length} 张图片`);
            renderTable(); // 刷新图片标记
        }

        async function deleteImageAndRefresh(imageId) {
            if (!confirm('确定删除这张图片？')) return;
            await deleteImage(imageId);
            await renderImageGallery();
            renderTable();
            toast('图片已删除');
        }

        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast'; el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCategoryModal(); closeProductModal(); closeImageModal(); } });
        document.getElementById('categoryModal').addEventListener('click', function(e) { if (e.target === this) closeCategoryModal(); });
        document.getElementById('productModal').addEventListener('click', function(e) { if (e.target === this) closeProductModal(); });
        document.getElementById('imageModal').addEventListener('click', function(e) { if (e.target === this) closeImageModal(); });

        renderAll();
    </script>
</body>
</html>
